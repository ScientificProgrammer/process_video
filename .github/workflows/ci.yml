name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
        env:
          SHELLCHECK_OPTS: -e SC1091  # Don't warn about non-constant source

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run unit tests
        run: bats tests/unit/*.bats

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n process_video

      - name: Check fetch_transcript syntax
        run: python3 -m py_compile fetch_transcript

  dry-run:
    name: Dry Run Test
    runs-on: ubuntu-latest
    needs: [lint, test, syntax]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Install jq (required)
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Test --help
        run: ./process_video --help

      - name: Test --version
        run: ./process_video --version

      - name: Test --list-patterns
        run: ./process_video --list-patterns || true  # May fail without fabric

      # Note: Full dry-run requires fabric which isn't installed in CI
      # Real integration tests should be run locally before release
